name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build & Test Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create Google Services JSON File
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "$GOOGLE_SERVICES_SECRET" | base64 --decode > app/google-services.json
            echo "google-services.json restored from secret."
          else
            echo "GOOGLE_SERVICES_JSON secret not set, skipping..."
          fi

      - name: Create .env from Example if not present
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Generate Gradle Wrapper if missing
        run: |
          gradle wrapper --gradle-version 9.3.1 || true

      - name: Beri Izin Akses Gradle
        run: chmod +x gradlew || true

      - name: Assemble Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
